# Alert scheduler.
#
# Same reasoning as ingest.yml: Vercel Hobby cron is daily-only, and the 24h
# "ending soon" watchlist alert needs tighter cadence than once a day to land
# close to the 24h mark instead of anywhere from 0-24h before. Hits the same
# endpoint pattern, authenticated the same way.
#
# vercel.json keeps a daily Vercel cron as a backstop. On Vercel Pro, raise
# that to 6-hourly and this workflow becomes optional.
#
# Reuses the CRON_SECRET and SITE_URL repository secrets already set up for
# ingest.yml — same endpoint family, same auth.

name: Send alert emails

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger alert emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "::error::CRON_SECRET and SITE_URL repository secrets must both be set"
            exit 1
          fi

          http_code=$(curl --silent --show-error --fail-with-body \
            --max-time 120 \
            --retry 2 --retry-delay 30 --retry-all-errors \
            --write-out '%{http_code}' \
            --output response.json \
            -H "authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/alerts") || true

          echo "HTTP $http_code"
          python3 -m json.tool < response.json || cat response.json

          case "$http_code" in
            2*) ;;
            *) echo "::error::alerts run returned HTTP $http_code"; exit 1 ;;
          esac
