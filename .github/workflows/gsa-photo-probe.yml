# One-off: runs /api/ingest/gsa-photo-probe and prints the result, so the
# answer lands in the Actions log. Delete together with the probe route.
name: GSA photo probe

on:
  push:
    branches: [main]
    paths: [".github/workflows/gsa-photo-probe.yml"]
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run probe
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          curl --silent --show-error --max-time 90 \
            -H "authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/ingest/gsa-photo-probe" | python3 -m json.tool
